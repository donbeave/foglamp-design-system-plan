<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SourceGeist;src:url('/fonts/geist-source.woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:SourceGeistFallback;src:local('Arial');ascent-override:74.67%;descent-override:21.92%;line-gap-override:0%;size-adjust:134.59%}
body{font-family:Arial;font-size:14px}button{display:flex;width:240px;align-items:center;font:inherit;gap:8px}div{margin-left:auto;display:inline-flex;gap:2px}kbd{font-family:SourceGeist,SourceGeistFallback,monospace;border:1px solid;padding:0 6px;border-radius:6px;line-height:20px}
</style><script>window.samples=[];window.shifts=[];new PerformanceObserver(l=>window.shifts.push(...l.getEntries().map(e=>({t:e.startTime,value:e.value,sources:e.sources.map(x=>({text:x.node?.textContent,prev:x.previousRect,cur:x.currentRect}))})))).observe({type:'layout-shift',buffered:true});function sample(){const d=document.querySelector('button div'),k=document.querySelector('kbd:last-child');if(d&&k){let range=document.createRange();range.selectNodeContents(k);window.samples.push({t:performance.now(),group:d.getBoundingClientRect().width,glyph:range.getBoundingClientRect().width,fonts:[...document.fonts].map(f=>({family:f.family,status:f.status}))})}if(performance.now()<3500)requestAnimationFrame(sample)}requestAnimationFrame(sample)</script></head><body><button>Search documentation<div><kbd>⌘</kbd><kbd>K</kbd></div></button></body></html>
